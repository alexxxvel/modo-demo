<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Osmolovka · показ клиенту</title><style>body{margin:0;background:#131417;color:#f4f5f7;font:17px/1.5 system-ui,sans-serif}main{max-width:620px;margin:12vh auto;padding:28px}h1{font-size:32px}button{background:#d9252b;border:0;border-radius:10px;color:white;padding:15px 24px;font:inherit;cursor:pointer}p{color:#c8cdd5}small{color:#929aa7}</style><main><p>Osmolovka Car Spa</p><h1>Сайт, бот и CRM</h1><p id="status" role="status">Подключаем демонстрационный стенд…</p><button id="open" hidden>Открыть показ</button><p><small>Учебные данные. Настоящие Telegram-отправки отключены. Показ доступен, пока включён компьютер владельца.</small></p></main><script>
(function(){var status=document.getElementById('status'),button=document.getElementById('open');var key=new URLSearchParams(location.hash.slice(1)).get('key');if(!key){status.textContent='Для входа нужна полная ссылка-приглашение. Попросите её у владельца показа.';return;}async function open(){try{status.textContent='Подключаем демонстрационный стенд…';var r=await fetch('https://api.github.com/repos/alexxxvel/modo-demo/contents/preview-state.json?ref=osmolovka-client-preview-state&t='+Date.now(),{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw new Error();var file=await r.json(),state=JSON.parse(atob(file.content.replace(/\s/g,''))),url=new URL(state.url);if(url.protocol!=='https:'||!/^[a-z0-9.-]+\.lhr\.life$/.test(url.hostname))throw new Error();location.replace(url.origin+'/__share?next=%2F__demo#key='+encodeURIComponent(key));}catch(e){status.textContent='Не удалось подключиться. Повторите попытку; компьютер владельца показа должен быть включён.';button.hidden=false;}}button.onclick=open;open();})();
</script></html>
